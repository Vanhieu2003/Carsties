services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgrepw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  mongodb:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=mongopw
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/var/lib/mongodb/data
volumes:
  pgdata:
  mongo_data: